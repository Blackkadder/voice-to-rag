# Voice RAG Full Pipeline Workflow Definition
# This YAML can be used with Databricks Asset Bundles (DABs) or converted to JSON for API

name: voice-rag-full-pipeline
description: "Full RAG pipeline: ingestion → embedding → indexing"

tags:
  project: voice-rag
  pipeline: full
  environment: ${bundle.environment}

# Workflow schedule (optional - uncomment to enable)
# schedule:
#   quartz_cron_expression: "0 0 * * * ?"  # Daily at midnight
#   timezone_id: "UTC"
#   pause_status: UNPAUSED

parameters:
  - name: catalog
    default: main
  - name: schema
    default: default
  - name: embedding_model
    default: databricks-gte-large-en
  - name: chunk_size
    default: "512"
  - name: chunk_overlap
    default: "50"

# Shared job cluster for all tasks
job_clusters:
  - job_cluster_key: rag_pipeline_cluster
    new_cluster:
      spark_version: "14.3.x-scala2.12"
      node_type_id: "i3.xlarge"
      autoscale:
        min_workers: 1
        max_workers: 4
      spark_conf:
        spark.databricks.delta.preview.enabled: "true"
        spark.sql.shuffle.partitions: auto
      spark_env_vars:
        PYSPARK_PYTHON: /databricks/python3/bin/python3

tasks:
  # Task 1: Document Ingestion
  - task_key: document_ingestion
    description: "Ingest and chunk documents from transcriptions"
    job_cluster_key: rag_pipeline_cluster
    python_wheel_task:
      package_name: voice_rag_backend
      entry_point: ingestion
      parameters:
        - "catalog={{job.parameters.catalog}}"
        - "schema={{job.parameters.schema}}"
        - "chunk_size={{job.parameters.chunk_size}}"
        - "chunk_overlap={{job.parameters.chunk_overlap}}"
        - "chunking_strategy=recursive"
    libraries:
      - pypi:
          package: databricks-sdk>=0.18.0
      - pypi:
          package: pyyaml>=6.0
    timeout_seconds: 3600

  # Task 2: Generate Embeddings
  - task_key: generate_embeddings
    description: "Generate vector embeddings for document chunks"
    depends_on:
      - task_key: document_ingestion
    job_cluster_key: rag_pipeline_cluster
    python_wheel_task:
      package_name: voice_rag_backend
      entry_point: embedding
      parameters:
        - "catalog={{job.parameters.catalog}}"
        - "schema={{job.parameters.schema}}"
        - "embedding_model={{job.parameters.embedding_model}}"
        - "embedding_dimension=1024"
        - "batch_size=32"
    libraries:
      - pypi:
          package: databricks-sdk>=0.18.0
      - pypi:
          package: requests>=2.28.0
    timeout_seconds: 7200

  # Task 3: Vector Index Sync
  - task_key: manage_vector_index
    description: "Create and sync vector search index"
    depends_on:
      - task_key: generate_embeddings
    job_cluster_key: rag_pipeline_cluster
    python_wheel_task:
      package_name: voice_rag_backend
      entry_point: indexing
      parameters:
        - "catalog={{job.parameters.catalog}}"
        - "schema={{job.parameters.schema}}"
        - "embedding_dimension=1024"
        - "index_type=DELTA_SYNC"
    libraries:
      - pypi:
          package: databricks-sdk>=0.18.0
      - pypi:
          package: databricks-vectorsearch>=0.22
    timeout_seconds: 1800

max_concurrent_runs: 1
format: MULTI_TASK

# Email notifications (optional)
# email_notifications:
#   on_failure:
#     - alerts@example.com
#   on_success:
#     - reports@example.com

